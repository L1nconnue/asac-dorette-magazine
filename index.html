<!DOCTYPE html>
<!--
  Home page for ASAC Magazine.
  This page emulates the immersive single‑page experience from Floema: a full‑screen
  hero with a zoom effect followed by sections that slide over one another when
  scrolled. Each section represents a featured article category. A minimal
  language switch and a contents/menu button live in the header. All copy will
  be translated dynamically via JavaScript to support French and English.
-->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASAC Magazine</title>
    <link rel="icon" href="favicon.png" type="image/png" />
    <!-- Google Fonts for typography -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="logo-wrapper">
        <img src="images/logo-blue.png" alt="ASAC" class="logo-light" />
        <img src="images/logo-white.png" alt="ASAC" class="logo-dark" />
      </div>
      <div class="header-controls">
        <!-- language toggle will be controlled by JS -->
        <button id="langToggle" class="control-btn">FR</button>
        <!-- menu toggle navigates to the contents page; label and icon are
             separated so we can hide the label on mobile and display a burger icon -->
        <button id="menuToggle" class="control-btn">
          <span class="menu-label">Sommaire</span>
          <span class="menu-icon">
            <span class="line"></span>
            <span class="line"></span>
            <span class="line"></span>
          </span>
        </button>
      </div>
    </header>

    <main id="home" class="scroll-container">
      <!-- Hero section -->
      <section class="panel hero" id="hero" style="background-image: url('images/hero.jpg');">
        <div class="hero-overlay">
          <h1 class="magazine-title">ASSURANCES ET SÉCURITÉ</h1>
          <p class="magazine-subtitle">
            Le Magazine de l'Association des Sociétés d'Assurance du Cameroun
          </p>
        </div>
      </section>
      <!-- Featured cards. Each card will slide in as the user scrolls. -->
      <section class="panel feature-card" data-category="Focus" style="background-image: url('images/focus.jpg');">
        <div class="card-overlay">
          <span class="category-label">Focus</span>
          <h2 class="card-title">Titre de l'article Focus</h2>
        </div>
      </section>
      <section class="panel feature-card" data-category="Emploi" style="background-image: url('images/emploi.jpg');">
        <div class="card-overlay">
          <span class="category-label">Emploi</span>
          <h2 class="card-title">Titre de l'article Emploi</h2>
        </div>
      </section>
      <section class="panel feature-card" data-category="Ça Bouge" style="background-image: url('images/cabouge.jpg');">
        <div class="card-overlay">
          <span class="category-label">Ça bouge !</span>
          <h2 class="card-title">Titre de l'article Ça Bouge</h2>
        </div>
      </section>
      <section class="panel feature-card" data-category="Actualité" style="background-image: url('images/actualite.jpg');">
        <div class="card-overlay">
          <span class="category-label">Actualité</span>
          <h2 class="card-title">Titre de l'article Actualité</h2>
        </div>
      </section>
    </main>

    <script src="js/main.js"></script>
  </body>
</html>
